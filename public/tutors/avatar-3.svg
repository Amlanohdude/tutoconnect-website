    <path d="M32 40 C30 24, 40 16, 52 16 C63 16, 68 23, 68 39 C68 41, 64 33, 61 33 C56 33, 50 25, 42 27 C36 29, 33 34, 32 40 Z" fill="#334155"/>
    
